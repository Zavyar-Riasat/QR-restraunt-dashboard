<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F26B1D" />
    <meta name="description" content="Dineflow Restaurant POS & Real-Time Kitchen Operations Dashboard" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dineflow" />
    <title>Dineflow • Restaurant Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      (function () {
        try {
          var isLocal =
            location.hostname === 'localhost' ||
            location.hostname === '127.0.0.1' ||
            location.hostname.endsWith('.local');

          if (isLocal && 'serviceWorker' in navigator) {
            var hadController = Boolean(navigator.serviceWorker.controller);
            Promise.all([
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }),
              'caches' in window
                ? caches.keys().then(function (names) {
                    return Promise.all(names.map(function (n) { return caches.delete(n); }));
                  })
                : Promise.resolve(),
            ]).then(function () {
              if (hadController && sessionStorage.getItem('dineflow_local_sw_cleared') !== '1') {
                sessionStorage.setItem('dineflow_local_sw_cleared', '1');
                window.location.reload();
              }
            });
          } else if ('caches' in window) {
            var CURRENT_SW_VERSION = 'dineflow-pwa-v6';
            var savedVersion = localStorage.getItem('dineflow_sw_version');
            if (savedVersion !== CURRENT_SW_VERSION) {
              localStorage.setItem('dineflow_sw_version', CURRENT_SW_VERSION);
              caches.keys().then(function (names) {
                return Promise.all(
                  names
                    .filter(function (n) { return n !== CURRENT_SW_VERSION; })
                    .map(function (n) { return caches.delete(n); })
                );
              });
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  regs.forEach(function (r) { r.update(); });
                });
              }
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
